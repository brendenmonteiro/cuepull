name: Build and release

# Builds installers for Windows and macOS. Pushing a v* tag publishes them to
# a draft release; the manual trigger just builds so a change can be checked
# without cutting a release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      # One platform failing should not hide whether the other worked.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install client and server dependencies
        run: |
          npm ci --prefix client
          npm ci --prefix server

      # Fetches yt-dlp and ffmpeg for every architecture the host platform
      # targets, verifying yt-dlp against its published checksum. macOS builds
      # two dmgs, so it needs both an arm64 and an x64 ffmpeg.
      - name: Fetch bundled binaries
        run: npm run fetch:bin

      # A missing or misplaced binary shows up here rather than as an opaque
      # packaging failure later.
      - name: Show binary layout
        shell: bash
        run: ls -lR resources/bin

      - name: Build the UI
        run: npm run build:ui

      - name: Package
        run: npx electron-builder --publish never
        env:
          # Without a signing identity, skip signing rather than failing. The
          # release is unsigned on both platforms and the checksums cover it.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          DEBUG: electron-builder

      - name: Checksums
        run: npm run checksums

      - uses: actions/upload-artifact@v4
        with:
          name: cuepull-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Each platform writes its own SHA256SUMS.txt, so merge them into one
      # file rather than shipping two that overwrite each other.
      - name: Combine checksums
        run: |
          mkdir -p out
          find artifacts -type f \( -name '*.exe' -o -name '*.dmg' \) -exec cp {} out/ \;
          : > out/SHA256SUMS.txt
          for f in artifacts/*/SHA256SUMS.txt; do
            [ -f "$f" ] && cat "$f" >> out/SHA256SUMS.txt
          done
          ls -la out/
          cat out/SHA256SUMS.txt

      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          # Draft so the notes can be written before anything goes public.
          draft: true
          files: |
            out/*.exe
            out/*.dmg
            out/SHA256SUMS.txt
